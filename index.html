<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unison — книги в несколько голосов</title>
<meta name="description" content="Аудиокниги по ролям с синхронной подсветкой текста. Работает офлайн.">
<meta name="theme-color" content="#1a1520">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="views">
  <section id="v-library" class="view" hidden></section>
  <section id="v-updates" class="view" hidden></section>
  <section id="v-history" class="view" hidden></section>
  <section id="v-more" class="view" hidden></section>
  <section id="v-page" class="view" hidden></section>
  <section id="v-book" class="view" hidden></section>
  <section id="v-reader" class="view" hidden>
    <header class="bar solid" id="rbar">
      <button class="ib" id="rBack" aria-label="Назад"></button>
      <h1 class="bar-title" id="rTitle"></h1>
      <button class="ib" id="rAa" aria-label="Оформление текста">Aa</button>
      <button class="ib" id="rSearch" aria-label="Поиск в главе"></button>
      <button class="ib" id="rBm" aria-label="Закладки"></button>
      <button class="ib" id="rMenu" aria-label="Меню"></button>
    </header>
    <article id="text"></article>
    <nav class="chnav"><button id="prevCh">‹ Предыдущая</button><button id="nextCh">Следующая ›</button></nav>
  </section>
</div>

<footer id="player" hidden>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Позиция">
  <div class="prow">
    <span id="time">0:00</span>
    <button class="ib" id="rew" aria-label="Назад 15 секунд">↺15</button>
    <button class="ib big" id="play" aria-label="Играть"></button>
    <button class="ib" id="fwd" aria-label="Вперёд 15 секунд">15↻</button>
    <button class="ib" id="speed" aria-label="Скорость">1×</button>
  </div>
  <button id="follow" hidden>↧ К текущему месту</button>
  <button id="sleepInd" hidden aria-label="Таймер сна"></button>
</footer>
<div id="roChip" hidden><span>Только чтение</span><button id="roListen">▶ Слушать отсюда</button><button id="roExit" aria-label="Выйти из режима">✕</button></div>

<button id="fab" hidden><span class="fab-i"></span><span class="fab-t">Продолжить</span></button>
<div id="selbar" hidden></div>

<div id="modes" hidden></div>
<nav id="nav">
  <button data-tab="library"><i></i><span>Библиотека</span></button>
  <button data-tab="updates"><i></i><span>Обновления</span><b class="badge" hidden></b></button>
  <button data-tab="history"><i></i><span>История</span></button>
  <button data-tab="more"><i></i><span>Ещё</span></button>
</nav>

<div id="scrim" hidden></div>
<div id="menu" hidden role="menu"></div>
<div id="sheet" hidden></div>
<div id="dialog" hidden></div>
<div id="toast" hidden></div>
<audio id="audio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
